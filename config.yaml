# Single source of truth for every pipeline parameter.
# Skills, playbook and scripts refer to keys here (e.g. `render.duck_db`), never restate values.
# Any change must be noted in <episode>/logs/notes.md with a reason.
version: 2

env:
  threads: 4                    # torch / ctranslate2 / OMP thread count (pinned for determinism)
  venv_dfn_asr: /workspace/podcast/smoke/.venv   # py3.11 torch2.0.1: DeepFilterNet3 + faster-whisper
  venv_main: /workspace/podcast/smoke/.venv2     # py3.11 torch2.8: everything else
  ffmpeg_version: "7.1.5"       # checked by ingest.py (prefix match)
  lame_version: "3.100"         # libmp3lame linked into ffmpeg (from dpkg)

models:
  asr: {repo: kotoba-tech/kotoba-whisper-v2.0-faster, revision: f44edd35eaeb2274e85ac7b31fb2c6f59ff1c4bc}
  dfn: {name: DeepFilterNet3, pip: "deepfilternet==0.5.6"}
  vad: {name: silero, pip: "silero-vad==6.2.0"}
  aligner: {name: torchaudio.pipelines.MMS_FA, pip: "torchaudio==2.8.0"}

ingest:
  sample_rate: 48000
  codec: pcm_s24le
  channels: 1
  resampler: soxr               # aresample=resampler=soxr
  max_start_offset_s: 0.1       # stream start_time beyond LAME delay compensation -> fail
  max_length_diff_s: 1.0        # decoded length vs longest track -> fail (offset check replaces 5 s rule)

sync:
  reference: longest            # longest decoded track is the reference
  window_s: 120                 # analysed at start and end of each track
  env_rate_hz: 100              # bleed envelope rate (10 ms frames)
  max_lag_s: 2.0
  min_peak_confidence: 0.25     # normalised xcorr peak; below -> no correction, logged
  min_offset_ms: 20             # correct constant offset only above this
  max_drift_ppm: 50             # resample only above this drift

clean:
  dfn_atten_lim_db: 18
  highpass_hz: 80
  deess: {freq_hz: 6000, threshold_db: -30, ratio: 4}
  compressor: {threshold_db: -20, ratio: 3, attack_ms: 5, release_ms: 100}
  limiter: {threshold_db: -3, release_ms: 100}

level:                          # leveler: runs per track after clean, before VAD/ASR/edit
  target_lufs: -20              # static per-track integrated loudness first
  window_s: 3.0                 # RMS window of the slow leveler
  hop_s: 0.1
  gate_dbfs: -50                # windows below gate hold the previous gain
  max_gain_db: 6                # +/- clamp of leveler gain
  smoothing_s: 1.0

vad:                            # the only VAD: Silero
  sample_rate: 16000
  threshold: 0.5
  min_speech_ms: 120
  min_silence_ms: 200
  speech_pad_ms: 30

transcript:                     # primary text source: Zencastr TSV (raw/transcript.csv) -> zencastr_transcript.py
  source: zencastr              # zencastr (default) | asr (force full kotoba ASR). Full ASR also runs if there is no CSV.
  offset_s: 0.0                 # transcript clock vs synced timeline
  max_utt_s: 30                 # an utterance never spans longer than this
  snap_s: 0.6                   # snap utterance start to a VAD island onset within this
  end_pad_s: 0.1
  uncovered_min_s: 1.5          # speaker VAD islands this long with no utterance -> logs/transcript_coverage.json

asr:                            # kotoba-whisper: full-episode ASR only when there is no Zencastr transcript
  fallback: "off"               # off | gaps: also transcribe transcript_coverage gaps (asr.py --gaps) and merge
  device: cpu
  compute_type: float32         # int8 forbidden (garbage output)
  language: ja
  beam_size: 5
  temperature: [0.0]            # no fallback; low-quality segments logged
  condition_on_previous_text: false
  word_timestamps: false        # segfaults; timing comes from align_kana.py
  max_chunk_s: 25               # VAD islands merged into chunks up to this length
  merge_gap_s: 0.6
  log_prob_threshold: -1.0      # logged as fallback-would-trigger
  compression_ratio_threshold: 2.4

align:
  sample_rate: 16000
  pad_s: 0.15
  min_word_score: 0.35          # mean per-token prob below -> segment goes to review
  min_segment_score: 0.5

text:
  yield_markers: [どうぞ, ごめん, すみません, すいません, お先に]
  # fugashi + unidic-lite (pinned in requirements). A token is a filler only if its POS1 is in filler_pos
  filler_pos: [フィラー, 感動詞]
  fillers: [えー, えーと, えっと, えと, あー, あーの, あの, あのー, んー, ん, うーん, まあ, まー, そのー, えーっと, なんか]
  backchannels: [うん, うんうん, ううん, へー, へえ, ほー, はい, はいはい, はいはいはい, なるほど, そうそう, そうね, そうですね, たしかに, 確かに, ええ, おー, あー, ああ]
  laugh_markers: [笑, ハハ, はは, ふふ, フフ, www, 草]
  mistake_markers: [カットで, 今のなし, 撮り直し, 言い直し]

candidates:
  long_pause:                   # 長すぎる沈黙と間: gaps in the union of per-speaker VAD
    within_turn_min_s: 1.2      # same speaker before and after the gap
    between_speakers_min_s: 1.5 # speaker changes across the gap
    target_s: 0.7               # gap compressed to this (kept centred, room tone + crossfade)
    laugh_lookahead_s: 2.0      # laugh / short non-text island within this after the gap -> review
  filler_isolation_s: 0.15      # silence needed on both sides of a filler token
  backchannel_max_s: 1.2
  backchannel_keep_every_s: 10  # keep one per listener per window
  acoustic_island_max_s: 0.8    # VAD island with no aligned text -> acoustic filler/backchannel candidate
  overlap_onset_s: 0.5
  yield_max_s: 1.5              # yielding speaker stops within this
  continue_min_s: 2.0           # continuing speaker has at least this much speech in the next continue_window_s
  continue_window_s: 4.0
  yield_pre_silence_s: 1.0      # yielder was silent this long before (a turn start, not the end of their sentence)
  yield_marker_window_s: 3.0    # mute only if the yielder says a yield marker (text.yield_markers) within this; else review
  overlap_restart:              # aborted short phrase under another speaker's onset, restarted with a shared content word
    enabled: true
    max_s: 2.0                  # aborted phrase at most this long
    restart_window_s: 2.5       # restart starts within this after the aborted phrase ends -> auto mute own track only
    interject_lead_s: 0.5       # interjection case: the other speaker's substantive line started >= this before X (instead of an onset match)
    interject_end_re: '(か|\?|？|。|！|!)\s*$'   # interjection case skipped when X's phrase ends like this (「2022年か」「すごいね。」)
    light_words: [イル, イッ, ミタイ, スル, シ, ナル, アル, イウ, イワ, オモウ, オモ, コト, モノ, トコ, ヤツ, ソー, コー, ドー, ナン, ナンカ, ヨー, デキ, クル, キ, ク, ヤッ, ヤル]  # light verbs/nouns that do not prove a restart
  overlap_abandon:              # X's short phrase inside Y's ongoing line, X then gives up -> AUTO mute X's track only
    enabled: true
    max_s: 2.0
    continue_after_s: 1.0       # Y keeps talking at least this long past X's end
    silent_after_s: 3.0         # X says nothing for this long after
    vad_tail_s: 0.2             # VAD hangover after X's phrase ignored for the silence check
    vad_tolerance_s: 0.15       # VAD speech allowed in the silent window (breath/noise)
    sentence_end_re: '(。|！|!|\?|？|か|です|ます|でした|ました|よね|ね|よ|な|かな|だ|た|る|い|う)\s*$'  # finished phrase -> not abandoned
  mutual_yield:                 # both start together, both stop, one says どうぞ, the other restarts -> AUTO timeline cut
    enabled: true
    markers: [どうぞ, お先に]
    gap_s: 0.4                  # natural gap left before the restart
    restart_window_s: 3.0       # restart begins within this after the marker ends
  false_start_window_s: 3
  false_start_min_kana: 3
  crosstalk_min_overlap_s: 2
  protect_head_tail_s: 3        # only the clean start/end; opening_chatter handles the intro
  laugh_protect_s: 2.0
  context_s: 3
  auto_decide:                  # review -> keep (never -> cut) for low-information items; keeps the human list short
    enabled: true
    keep_overlap_yield: true
    min_conf: 0.5
  overlap_laughter:             # pure overlapping laughter only. Mute loses on one track; the timeline stays.
    enabled: true
    min_overlap_s: 0.2          # all named speakers must overlap by at least this (a chain of pairs is not a triple)
    min_span_s: 0.15            # ignore a shorter pure-laugh span
    merge_gap_s: 0.25           # join same-speaker pure-laugh spans separated by <= this
    max_laugh_chars: 40         # longer text is not a pure laugh
    max_speech_overlap_s: 0.0   # same-speaker non-laugh overlapping a laugh word by more than this = mixed, left untouched
    require_status_ok: true     # rejected / low alignment is ambiguous and is not muted
    min_word_score: null        # null = align.min_word_score
    mute_extent: overlap_only   # overlap_only | full_span (full_span reviews the span if win/lose conflicts)
    respect_edge_protect: true  # head/tail (protect_head_tail_s) stays human review
    max_decided_speakers: 3     # more simultaneous pure laughs -> review, no mute
    two_speaker: review         # review | role_map. No built-in winner for exactly two laughs.
    two_speaker_role_winners: {} # only if two_speaker is role_map. Key "role+role" (order ignored) -> winning role. Empty = review.
    primary_host_role: primary_host
    interviewee_role: interviewee
    roles_manifest_key: speaker_roles  # episode manifest.json only; do not put track mappings in this repo

labels:
  # rule labels on these types are auto-approved; everything else needs approved: true
  auto_approve_types: [long_pause, filler, backchannel, overlap_restart, overlap_abandon, mutual_yield, overlap_laughter]

render:
  duck_db: -20                  # the only duck depth
  duck_fade_ms: 20
  crossfade_ms: 10              # equal-power, applied per track at every timeline join (same on all tracks)
  snap_window_ms: 30            # snap join to min-energy point of the summed tracks
  roomtone_s: 2.0               # quietest VAD-negative 2 s of each track, looped
  mix: dual_mono                # mono sum, written as identical L/R

jingle:                         # mid-show jingle, inserted ONCE (pipeline/jingle.py; after render, before ending_bgm)
  enabled: true
  prefer_range_frac: [0.3, 0.7]  # search this part of the edited show first (fractions of duration)
  max_tail_s: 4.0               # wait out trailing laughter/aizuchi (any track) up to this long, then insert; new real speech first -> reject
  speaker_change_bonus_s: 0.3   # fallback ranking: pause length + this if the speaker changes
  react_max_s: 1.0              # VAD island this short with no real transcript line on it counts as a reaction
  widen_step_frac: 0.1          # nothing there -> widen both sides by this per step (min_start_s/exclude_end_s still apply)
  file: ../../assets/jingle.mp3 # absolute, or relative to the episode dir; audio is never committed to the repo
  pre_silence_s: 0.4            # last speech end -> this much digital silence -> jingle
  post_silence_s: 0.2           # jingle -> this much silence -> speech resumes (the original gap is replaced)
  gain_db: -2.0                 # jingle active level relative to the voices' active level
  voice_ref_window_s: 60        # voice level measured over +-this around the insertion
  min_gap_s: 0.35               # a candidate pause = gap in all speakers' VAD at least this long, between transcript segments
  min_start_s: 120              # never in the first 2 min ...
  exclude_end_s: 180            # ... nor in the last stretch (also never inside ending_bgm.search_window_s)
  chapter_before_s: 20          # a chapter boundary (the one nearest the episode midpoint wins) uses the pause
  chapter_after_s: 5            #   nearest it within [-before, +after]; else the longest sentence-end pause (speaker change preferred)
  avoid_margin_s: 1.0           # keep this far from overlaps (overlap_yield/restart edits) only; laughs/aizuchi are waited out (max_tail_s)
  segment_tolerance_s: 0.3      # a transcript segment running > this past both gap edges = mid-sentence (rejected)
  edge_fade_ms: 10              # fades on the voice either side of the insertion
  track_shift: true             # chapter where the next speaker starts over the others' laugh/aizuchi/sentence tail: split ONLY that
                                #   speaker's track before their onset, let the others finish, 0.4 s -> jingle -> 0.2 s, resume all (needs work/render stems)
  shift_only_at_chapters: true  # track-shift only near chapter boundaries (within chapter_before_s/after_s); they rank like chapter pauses
  max_shift_s: 3.0              # max tail wait (all-quiet point - split point)
  split_pad_s: 0.05             # split this far before the shifted speaker's VAD onset
  own_silence_s: 0.3            # shifted speaker must be silent at least this long before the onset (split lands in silence)
  max_tail_overlap_s: 1.5       # another track's substantive line may run at most this past the onset (else overlap -> reject)

ending_bgm:                     # render stage, after mix, before loudness (pipeline/ending_bgm.py). Not the mid-show jingle.
  enabled: true
  mode: full_asset              # full_asset | phrase_tail. Absent key in an older episode config = phrase_tail.
  file: ../../assets/ending_bgm.mp3   # music asset. Absolute, or relative to the episode dir. Never commit the audio.
  # phrase_tail (legacy): fade in lead_in_s before the last closing phrase, bed under speech, rise after the last
  # speech, hold tail_s, fade_out_s, then end_silence_s. A longer file is not played past that envelope.
  phrases: ["ということで"]       # phrase_tail only. LAST occurrence within search_window_s of the voice-mix end.
  search_window_s: 120
  lead_in_s: 3.0                # phrase_tail: fade-in starts this long before the phrase. full_asset: unused for placement.
  fade_in_s: 2.0                # entrance ramp at the asset start (does not drop the tail)
  bed_db: -20                   # under speech, dB relative to the voices' active level (-18 .. -22)
  voice_ref_window_s: 60        # voice active level measured over this long before the gain speech end
  min_island_s: 0.2             # VAD islands shorter than this don't count as the last speech
  ramp_s: 1.5                   # after the gain speech end, ramp bed -> tail level. Does not shorten the file.
  tail_db: -4                   # post-speech level, dB relative to the voices' active level
  tail_s: 5.0                   # phrase_tail only: BGM-only time after the last speech end (incl. ramp)
  fade_out_s: 7.0               # phrase_tail only: fade-out, linear in dB, from tail_db ...
  fade_out_floor_db: -60        # phrase_tail only: ... down to this, then gain 0
  end_silence_s: 1.5            # digital silence AFTER the music payload (full_asset) or after the fade (phrase_tail)
  bgm_offset_s: 0.0             # samples before this in the music file are skipped; the rest through EOF is the payload
  # full_asset: play that payload once. No loop. tail_s / fade_out_s do not crop it. Natural tail stays at tail_db
  # (or bed_db if the payload ends at/before the gain speech end). tail_fade_ms 0 = do not fade the last samples.
  end_anchor: episode_end       # episode_end | speech_end | explicit. Where the shared asset end aims.
  end_anchor_s: null            # explicit only: seconds on the edited timeline. Set in the episode config, not here.
  music_start_s: null           # optional edited-timeline start. End is then this + payload length (episode may grow).
  outro_file: ""                # optional second asset. Empty = music only. Same path rules; never commit the audio.
  outro_offset_s: 0.0           # skip this much of the outro file; the rest through EOF is the payload
  outro_start_s: null           # optional edited-timeline start. See playbook for which end wins when both starts are set.
  outro_bed_db: null            # null = bed_db. Per-asset level under speech.
  outro_tail_db: null           # null = tail_db
  start_floor_s: 0.0            # derived starts are shifted later together rather than cropped before this time
  gain_speech_end_s: null       # null = last qualifying VAD end. Only the bed->tail rise; not the file end.
  tail_fade_ms: 0               # full_asset only. 0 keeps the payload's last samples at the hold level.

loudness:                       # one tool: ffmpeg loudnorm two-pass, must be linear
  target_lufs: -16
  max_true_peak_dbtp: -1.0
  lra: 11
  limiter_headroom_db: 1.5      # pre-limit so the linear gain lands this far below the TP ceiling
  master: {sample_rate: 48000, codec: pcm_s24le, channels: 2}
  mp3: {codec: libmp3lame, bitrate: 192k, sample_rate: 44100, channels: 2}

chapters:
  min_gap_s: 120

qa:
  lufs_tolerance: 0.5
  clip_s: 2.0                   # same length for every exported cut clip
  click_ratio: 8.0              # |diff| at join vs local median |diff| (x)
  click_min_abs: 0.02           # and absolute floor (full scale)
  click_ratio_bgm: 2.5          # joins under the ending BGM: step vs local 99.9th pct |diff| (music attacks aren't clicks)
  level_jump_db: 6              # flagged (not failing): RMS 50 ms either side of join
  head_tail_s: 30
  head_tail_max_silence_s: 1.5   # interior gaps in first/last head_tail_s; = long_pause.between_speakers_min_s (shorter gaps are natural turn-taking)
  edge_max_silence_s: 0.5       # leading/trailing silence on the MP3
  write_clips: false            # per-join WAV clips in work/qa (debug only)

structure:                      # edits built from structure, not labels (label_store.py structural)
  edge_silence_s: 0.3           # leading/trailing silence kept (QA max 0.5)
  opening_chatter:              # cut small talk before the main theme
    enabled: true
    lead_s: 0.3                 # clean start: silence kept before the theme line
    min_s: 0
    max_s: 600                  # only search the first 10 min
    start_markers: ["今日は", "今回は", "本日は", "テーマ", "始めた", "周年"]
    # per-episode override in manifest.json: "opening_chatter": {"start_text": "<exact transcript text>"}

output:                         # MP3-only delivery: out/<slug>.mp3 (+ chapters.json); no WAV master
  delete_render_wavs: true      # delete work/mix.wav, work/render/*.wav after encoding

gate:                           # per-track speech gating after cleaning/levelling (pipeline/gate.py)
  enabled: true
  attenuation_db: -inf          # outside own speech: "-inf" = full mute, or e.g. -40
  pad_before_ms: 150
  pad_after_ms: 250
  merge_gap_ms: 300
  fade_ms: 15                   # 10-20 ms
  transient_max_s: 0.6          # VAD islands up to this long without firm text (word mostly inside)/laugh/backchannel are checked
  voicing_max: 0.35             # autocorr peak 80-400 Hz below this -> unvoiced (transient only if also noise-like high band)
  hb_share_min: 0.4             # transient also needs noise-like high band: energy share above 2 kHz > this ...
  centroid_min_hz: 2000         # ... or spectral centroid above this (breathy/creaky word endings stay low-band -> kept)
  island_unvoiced_frac: 0.6     # island with >= this share of unvoiced 100 ms windows: its words are not firm support
  island_sniff_max_s: 1.0       # mostly-unvoiced islands up to this long with a transient window are muted whole
  surround_s: 0.1               # inner 100 ms transient windows are muted only with no voiced window within this
  word_end_keep_s: 0.2          # never mute this long after a VAD end that sits at a word end (also tail-side edge keep)
  word_end_tol_s: 0.15          # |VAD end - word end| <= this -> word-final
  flatness_min: 0.3             # spectral flatness above this -> noise-like
  edge_tail_min_s: 0.2          # unvoiced run at a voiced VAD island head/tail >= this -> muted (sniff glued to speech)
  edge_keep_s: 0.05             # kept next to the speech (word-final unvoiced consonants)
  burst_enabled: true          # cough / throat-clear rule (separate from sniff; band-independent)
  burst_max_s: 0.6              # island at most this long, no firm text, no laugh/backchannel
  burst_relative: true          # per track: onset = burst_onset_snr_frac x own SNR, start margin = clamp(own non-speech p90 - floor, min, max)
  burst_onset_snr_frac: 0.4
  burst_floor_min_db: 10
  burst_floor_max_db: 15
  burst_ns_margin_s: 0.3        # non-speech frames = this far from any VAD island
  burst_onset_db: 30            # fallback when burst_relative is off: level rise within burst_onset_ms ...
  burst_onset_ms: 40
  burst_floor_db: 10            # (fallback) ... starting within this of the track noise floor
  burst_voicing_max: 0.5        # unstable pitch: median 20 ms frame voicing below this ...
  burst_jump_max: 0.15          # ... or median frame-to-frame f0 jump above this
  burst_island_voicing_max: 0.6 # whole-island voicing at/above this = steady hum (んー), never a burst
  burst_word_max_s: 1.5         # an aligned word token (<= this long, i.e. not smeared) covering half the island -> a word, not a burst
  burst_gap_s: 0.2              # at least this after the speaker's own voiced speech end (decays are never bursts)
  fill_track: host              # room tone fill where every track is gated
  transient_rise_db: 15         # QA metric: burst = frames this far above the track noise floor, outside speech
  noise_floor_min_db: -80
